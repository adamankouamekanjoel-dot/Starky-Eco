<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paiement</title>

    <style>
      body {
        font: 16px system-ui, sans-serif;
        max-width: 32rem;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #17202a;
      }

      label,
      input,
      select,
      button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 0.5rem 0 1rem;
      }

      input,
      select,
      button {
        padding: 0.75rem;
        font: inherit;
      }

      button {
        cursor: pointer;
        background: #155eef;
        color: white;
        border: 0;
        border-radius: 0.4rem;
      }

      #result,
      #status-result {
        overflow-wrap: anywhere;
      }
    </style>
  </head>

  <body>
    <h1>Créer un lien de paiement</h1>

    <form id="payment-form">
      <label for="label">Produit ou service</label>
      <input id="label" maxlength="120" value="Paiement" required>

      <label for="amount">Montant</label>
      <select id="amount">
        <option value="500">500 XOF</option>
        <option value="1000">1 000 XOF</option>
      </select>

      <button type="submit">Générer le lien</button>
    </form>

    <p id="result" role="status" aria-live="polite"></p>

    <hr>

    <h2>Vérifier un paiement</h2>

    <form id="status-form">
      <label for="reference">Référence du paiement</label>
      <input id="reference" autocomplete="off" required>

      <button type="submit">Vérifier le statut</button>
    </form>

    <p id="status-result" role="status" aria-live="polite"></p>

    <script>
      const api = window.location.origin;
      const paymentForm = document.querySelector("#payment-form");
      const result = document.querySelector("#result");
      const statusForm = document.querySelector("#status-form");
      const statusResult = document.querySelector("#status-result");
      const referenceInput = document.querySelector("#reference");

      paymentForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "Création en cours…";

        try {
          const response = await fetch(`${api}/api/payment-links`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              amount: Number(document.querySelector("#amount").value),
              label: document.querySelector("#label").value.trim(),
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Création du lien impossible");
          }

          const paymentLink = findLink(data);
          const reference = findReference(data);

          result.replaceChildren();

          if (paymentLink) {
            const anchor = document.createElement("a");
            anchor.href = paymentLink;
            anchor.textContent = paymentLink;
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";

            result.append("Lien créé : ", anchor);
          }

          if (reference) {
            result.append(
              document.createElement("br"),
              `Référence du lien : ${reference}`
            );

            referenceInput.value = reference;
            statusResult.textContent =
              "Référence copiée dans le formulaire. Le statut sera actualisé après réception du webhook DigitalPaye.";
          }

          if (!paymentLink && !reference) {
            result.textContent = JSON.stringify(data);
          }
        } catch (error) {
          result.textContent = error.message;
        }
      });

      statusForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const reference = referenceInput.value.trim();
        statusResult.textContent = "Vérification en cours…";

        try {
          const response = await fetch(
            `${api}/api/payments/${encodeURIComponent(reference)}`
          );

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Vérification impossible");
          }

          const statusLabels = {
            successful: "Paiement confirmé",
            failed: "Paiement échoué",
            cancelled: "Paiement annulé",
            pending: "En attente du webhook de DigitalPaye",
          };

          statusResult.textContent =
            `${statusLabels[data.status] || `Statut reçu : ${data.status || "inconnu"}`} — référence ${reference}`;
        } catch (error) {
          statusResult.textContent = error.message;
        }
      });

      function findLink(value) {
        if (Array.isArray(value)) {
          return value.map(findLink).find(Boolean);
        }

        if (value && typeof value === "object") {
          for (const [key, child] of Object.entries(value)) {
            if (
              typeof child === "string" &&
              /(url|link)/i.test(key) &&
              /^https:\/\//i.test(child)
            ) {
              return child;
            }
          }

          for (const child of Object.values(value)) {
            const found = findLink(child);
            if (found) return found;
          }
        }

        return undefined;
      }

      function findReference(value) {
        if (!value || typeof value !== "object") {
          return undefined;
        }

        const keys = [
          "payment_link_id",
          "link_id",
          "payment_link_reference",
          "link_reference",
          "reference",
          "id",
        ];

        for (const key of keys) {
          if (value[key] != null && typeof value[key] !== "object") {
            return String(value[key]);
          }
        }

        for (const child of Object.values(value)) {
          const found = findReference(child);
          if (found) return found;
        }

        return undefined;
      }
    </script>
  </body>
</html>
